name: Temporary npm lockfile reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rt-map-lockfile-repair.yml"

permissions:
  contents: read

jobs:
  reconcile-lockfile:
    name: Generate a consistent npm lockfile artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconcile lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload reconciled lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: rt-map-lockfile-reconciliation
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2
