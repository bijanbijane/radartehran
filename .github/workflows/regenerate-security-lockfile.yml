name: Security dependency lockfile regeneration

on:
  push:
    branches:
      - fix/security-deps-audit-2026-11-27
    paths:
      - .github/workflows/regenerate-security-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3

      - name: Pin npm to Cloudflare build version
        run: npm install --global npm@10.9.2

      - name: Regenerate package lock from declared manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): regenerate lockfile for security updates"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install exact lockfile
        run: npm ci --no-audit --no-fund

      - name: Capture dependency audit
        if: always()
        run: npm audit --json > npm-audit.json || true

      - name: Print dependency audit summary
        if: always()
        run: |
          node -e "const a=require('./npm-audit.json'); const v=a.metadata?.vulnerabilities ?? {}; console.log(JSON.stringify(v, null, 2)); for (const [name,p] of Object.entries(a.vulnerabilities ?? {})) console.log(name, p.severity, 'direct='+p.isDirect, 'fix='+JSON.stringify(p.fixAvailable)); const blocked=['vitest','@vitest/mocker','tinypool','sharp'].filter(name=>a.vulnerabilities?.[name]); if ((v.critical ?? 0)>0 || blocked.length) { console.error('SECURITY_AUDIT_GATE_FAILED',JSON.stringify({critical:v.critical ?? 0,blocked})); process.exit(1); }"

      - name: TypeScript
        run: npm run typecheck

      - name: Architecture guard
        run: npm run arch:check

      - name: Authentication regression
        run: npm run test:auth

      - name: Cloudflare platform and D1 isolation regression
        run: npm run test:cloudflare

      - name: D1 triad regression
        run: npx tsx --test tests/rt-db-triad-001.test.ts tests/rt-db-triad-002-forensic.test.ts

      - name: Storage regression
        run: npm run test:storage

      - name: Vitest suite
        run: npm run test:vitest

      - name: Frontend build
        run: npm run build

      - name: Upload audit and lockfile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-dependency-audit
          path: |
            npm-audit.json
            package-lock.json
          if-no-files-found: warn
