name: Apply Cloudflare Staging D1 Migrations (Protected Manual Gate)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-release-radartehran-staging
  cancel-in-progress: false

env:
  CI: "true"
  NODE_ENV: production

jobs:
  migrate-staging-d1:
    name: Validate & Apply Canonical D1 Migrations to radartehran-staging-db
    runs-on: ubuntu-latest
    environment: staging-migrations
    timeout-minutes: 15

    steps:
      - name: 1. Clean repository checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 2. Set up Node.js 22 with npm lockfile cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: 3. Install dependencies deterministically
        run: npm ci

      - name: 4. Verify protected migration credentials presence (without printing values)
        env:
          CF_STAGING_MIGRATION_TOKEN: ${{ secrets.CF_STAGING_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
            const hasToken = Boolean(process.env.CF_STAGING_MIGRATION_TOKEN && process.env.CF_STAGING_MIGRATION_TOKEN.trim().length > 10);
            const hasAccount = Boolean(process.env.CLOUDFLARE_ACCOUNT_ID && process.env.CLOUDFLARE_ACCOUNT_ID.trim().length > 10);
            console.log("CF_STAGING_MIGRATION_TOKEN secret configured:", hasToken);
            console.log("CLOUDFLARE_ACCOUNT_ID (var or secret) configured:", hasAccount);
            if (!hasToken || !hasAccount) {
              console.error("Missing required credentials in environment staging-migrations: secret CF_STAGING_MIGRATION_TOKEN and/or variable/secret CLOUDFLARE_ACCOUNT_ID");
              process.exit(1);
            }
          '

      - name: 5. Run Canonical D1 Migration Checksum & Local SQLite Ledger Verification
        run: |
          npm run lint
          npm run test:cloudflare
          CI=true npm run cf:staging:migrate:local
          rm -rf .wrangler

      - name: 6. Validate Exact Staging D1 Target, Apply Pending Migrations & Verify Remote d1_migrations Ledger
        env:
          CF_STAGING_MIGRATION_TOKEN: ${{ secrets.CF_STAGING_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/cloudflare/migrate-staging-d1.mjs --apply-remote

      - name: 7. Publish Migration Audit Summary
        if: always()
        run: |
          {
            echo "## Cloudflare Staging D1 Migration Summary (\`radartehran-staging-db\`)"
            echo "- **GitHub Environment**: \`staging-migrations\` (Protected Manual Approval Gate)"
            echo "- **Hard-Coded Target Database**: \`radartehran-staging-db\` (Environment: \`staging\`)"
            echo "- **Authoritative Ledger**: \`d1_migrations\` (\`migrations/d1\`)"
            echo "- **Worker Deployment Capability**: None (\`CF_STAGING_MIGRATION_TOKEN\` has zero Worker deploy permissions)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 8. Upload Non-Secret D1 Migration Audit Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radartehran-staging-d1-migration-audit
          path: docs/cloudflare/staging-d1-migration-audit.json
          if-no-files-found: ignore
          retention-days: 30
