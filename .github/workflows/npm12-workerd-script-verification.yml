name: npm 12 Workerd Install-Script Verification

on:
  push:
    branches: [fix/ci-typecheck-and-triad-contracts-2026-11-28]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/npm12-workerd-script-verification.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/npm12-workerd-script-verification.yml'

permissions:
  contents: write

concurrency:
  group: npm12-workerd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Approve pinned workerd script and verify frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin the Cloudflare build npm version
        run: |
          npm install --global npm@12.2.3 --no-audit --no-fund
          test "$(npm --version)" = "12.2.3"

      - name: Install dependencies with default-deny script policy
        run: npm ci --no-audit --no-fund

      - name: Approve only the pinned workerd install script
        run: npm install-scripts approve workerd

      - name: Verify pinned allowScripts policy
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const allowed = pkg.allowScripts ?? {};
            const workerd = Object.entries(allowed).find(([key]) => key.startsWith('workerd@'));
            if (!workerd || workerd[1] !== true || workerd[0] !== 'workerd@1.20261123.1') {
              throw new Error('Expected only the pinned workerd@1.20261123.1 install script approval');
            }
            console.log('Verified pinned workerd install-script approval.');
          "

      - name: Clean install with the narrowly approved workerd script
        run: npm ci --no-audit --no-fund

      - name: Verify workerd binary and frontend production build
        run: |
          npx workerd --version
          npm run build -w radartehran-frontend

      - name: Commit reviewed allowScripts policy to PR branch
        env:
          PR_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo "Pinned workerd approval is already committed."
          else
            git commit -m "build: approve pinned workerd install script"
            git push origin "HEAD:refs/heads/$PR_BRANCH"
          fi
