name: npm 12 Workerd Install-Script Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/frontend/**'
      - '.github/workflows/npm12-workerd-script-verification.yml'

permissions:
  contents: write

concurrency:
  group: npm12-workerd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Refresh lock metadata and verify pinned workerd install
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin the Cloudflare build npm version
        run: |
          npm install --global npm@12.2.3 --no-audit --no-fund
          test "$(npm --version)" = "12.2.3"

      - name: Refresh lockfile metadata without running dependency scripts
        run: npm install --save-dev --save-exact workerd@1.20261123.1 --ignore-scripts --no-audit --no-fund

      - name: Generate the version-pinned workerd script approval
        run: npm install-scripts approve workerd

      - name: Verify lock metadata and least-privilege script policy
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { execFileSync } from 'node:child_process';
            const before = JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json'], { encoding: 'utf8' }));
            const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const beforePackages = before.packages ?? {};
            const afterPackages = after.packages ?? {};
            const changedVersions = Object.keys(beforePackages).filter((key) =>
              beforePackages[key]?.version && afterPackages[key]?.version &&
              beforePackages[key].version !== afterPackages[key].version
            );
            if (changedVersions.length) throw new Error('Unexpected dependency version changes: ' + changedVersions.join(', '));
            const workerd = afterPackages['node_modules/workerd'];
            if (!workerd?.resolved || !workerd?.integrity) throw new Error('workerd lock entry must include resolved URL and integrity');
            if (workerd.version !== '1.20261123.1') throw new Error('Unexpected workerd version: ' + workerd.version);
            const allow = pkg.allowScripts ?? {};
            if (JSON.stringify(allow) !== JSON.stringify({ 'workerd@1.20261123.1': true })) {
              throw new Error('Only workerd@1.20261123.1 may be approved; got ' + JSON.stringify(allow));
            }
            console.log('Verified resolved/integrity metadata, unchanged dependency versions, and pinned workerd approval.');
          "

      - name: Clean install with only the pinned workerd script approved
        run: npm ci --no-audit --no-fund

      - name: Verify workerd binary and frontend production build
        run: |
          npx workerd --version
          npm run build -w radartehran-frontend

      - name: Commit verified lock metadata and script policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "The npm 12 lock metadata and pinned workerd policy are already current."
          else
            git commit -m "build: pin workerd install approval with resolved lock metadata"
            git push origin "HEAD:refs/heads/$PR_BRANCH"
          fi
