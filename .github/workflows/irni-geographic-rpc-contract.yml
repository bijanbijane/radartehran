name: IRNI Geographic RPC Consumer Contract

on:
  push:
    branches:
      - feat/irni-v1-workers-rpc-consumer
      - fix/geography-catalog-no-fabricated-parent-fallback
      - main
    paths:
      - "worker/irni/irniGeographicRpc*.ts"
      - "worker/types.ts"
      - "worker/routes/irniCanonicalRpcRoutes.ts"
      - "worker/router.ts"
      - "worker/migrationRegister.ts"
      - "src/utils/expressRouteCatalog.ts"
      - "tests/irni-canonical-rpc-route.test.ts"
      - "tests/irni-geographic-rpc-client.test.ts"
      - "tsconfig.irni-geographic-rpc.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/irni-geographic-rpc-contract.yml"
  pull_request:
    branches:
      - fix/geography-catalog-no-fabricated-parent-fallback
      - main
    paths:
      - "worker/irni/irniGeographicRpc*.ts"
      - "worker/types.ts"
      - "tests/irni-geographic-rpc-client.test.ts"
      - "tsconfig.irni-geographic-rpc.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/irni-geographic-rpc-contract.yml"

permissions:
  contents: read

jobs:
  irni-rpc-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Deterministic dependency installation
        run: npm ci --no-audit --no-fund

      - name: Focused RPC consumer behavior tests
        run: npx tsx --test tests/irni-geographic-rpc-client.test.ts tests/irni-geographic-rpc-v2.test.ts

      - name: Strict isolated RPC consumer typecheck
        run: npx tsc --noEmit -p tsconfig.irni-geographic-rpc.json
