name: Focused Geography Safety Tests

on:
  push:
    branches:
      - fix/geography-catalog-no-fabricated-parent-fallback

permissions:
  contents: read

jobs:
  geography-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deterministic dependency installation
        run: npm ci --no-audit --no-fund

      - name: Run focused geography safety suite
        run: npm run test:geography-catalog
