name: Deploy Cloudflare Staging (Routine Least-Privilege Release)

on:
  workflow_dispatch:
    inputs:
      run_live_smoke_tests:
        description: "Run post-deployment live HTTP & read-only migration readiness smoke tests"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-release-radartehran-staging
  cancel-in-progress: false

env:
  CI: "true"
  NODE_ENV: production

jobs:
  deploy-staging:
    name: Verify Committed Bindings, Deploy radartehran-staging & Verify Readiness
    runs-on: ubuntu-latest
    environment: staging-deploy
    timeout-minutes: 20

    steps:
      - name: 1. Clean repository checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 2. Set up Node.js 22 with npm lockfile cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: 3. Install dependencies deterministically
        run: npm ci

      - name: 4. Verify least-privilege routine deployment credentials presence (without printing values)
        env:
          CF_DEPLOY_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
            const hasToken = Boolean(process.env.CF_DEPLOY_API_TOKEN && process.env.CF_DEPLOY_API_TOKEN.trim().length > 10);
            const hasAccount = Boolean(process.env.CLOUDFLARE_ACCOUNT_ID && process.env.CLOUDFLARE_ACCOUNT_ID.trim().length > 10);
            console.log("CF_DEPLOY_API_TOKEN secret configured:", hasToken);
            console.log("CLOUDFLARE_ACCOUNT_ID (var or secret) configured:", hasAccount);
            if (!hasToken || !hasAccount) {
              console.error("Missing required credentials in environment staging-deploy: secret CF_DEPLOY_API_TOKEN and/or variable/secret CLOUDFLARE_ACCOUNT_ID");
              process.exit(1);
            }
          '

      - name: 5. Run TypeScript & Architecture Guardrails
        run: |
          npm run lint
          npm run typecheck
          npm run arch:check

      - name: 6. Run Unit, Contract & Cloudflare Platform Tests
        run: |
          npm run test:cloudflare
          npm run test:contracts
          node scripts/cloudflare/migrate-staging-d1.mjs --dry-check-only

      - name: 7. Build Production Client & Worker Assets
        run: npm run build

      - name: 8. Fail-Closed Read-Only Verification of Committed Staging Bindings (Zero Resource Creation or D1 Mutation)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/cloudflare/provision-staging.mjs --mode=verify-only --require-remote --reject-placeholder-ids

      - name: 9. Validate Staging Wrangler Configuration (Dry-Run Packaging Check)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env staging --dry-run --outdir /tmp/radartehran-staging-dryrun
          rm -rf /tmp/radartehran-staging-dryrun

      - name: 10. Deploy Worker Update Strictly to Existing Staging Worker (radartehran-staging)
        id: cf_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DEPLOY_OUT=$(npx wrangler deploy --env staging 2>&1)
          echo "$DEPLOY_OUT"
          DEPLOYED_URL=$(echo "$DEPLOY_OUT" | grep -Eo 'https://radartehran-staging\.[a-zA-Z0-9_-]+\.workers\.dev' | head -n 1 || true)
          VERSION_ID=$(echo "$DEPLOY_OUT" | grep -Eo 'Version ID: [0-9a-f-]+' | awk '{print $3}' | head -n 1 || true)
          if [ -z "$DEPLOYED_URL" ]; then
            echo "Failed to extract deployed radartehran-staging workers.dev URL from Wrangler output"
            exit 1
          fi
          echo "deployed_url=$DEPLOYED_URL" >> "$GITHUB_OUTPUT"
          echo "version_id=${VERSION_ID:-unknown}" >> "$GITHUB_OUTPUT"

      - name: 11. Execute Post-Deployment Smoke & Read-Only D1 Migration Readiness Verification
        if: ${{ inputs.run_live_smoke_tests == 'true' }}
        run: |
          node scripts/cloudflare/smoke-test-staging.mjs --url "${{ steps.cf_deploy.outputs.deployed_url }}"

      - name: 12. Publish Concise Staging Deployment Summary
        if: always()
        run: |
          {
            echo "## Routine Cloudflare Staging Deployment Summary (\`radartehran-staging\`)"
            echo "- **GitHub Environment**: \`staging-deploy\` (Worker Editor Scope on \`radartehran-staging\` Only — Zero D1 Write / Zero Resource Creation)"
            echo "- **Target Worker**: \`radartehran-staging\` (Production \`radartehran\` untouched)"
            echo "- **Deployed URL**: \`${{ steps.cf_deploy.outputs.deployed_url || 'N/A' }}\`"
            echo "- **Version ID**: \`${{ steps.cf_deploy.outputs.version_id || 'N/A' }}\`"
            echo "- **D1 Migration Policy**: Read-only verification via \`/api/health/readiness\` (\`d1_migrations\`); schema migrations are isolated in \`.github/workflows/migrate-staging-d1.yml\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 13. Upload Staging Resource Verification Manifest (Zero Secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radartehran-staging-resource-manifest
          path: docs/cloudflare/staging-resource-manifest.json
          if-no-files-found: ignore
          retention-days: 30
