name: Tehran Radar Runner Dispatch Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runner-dispatch-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/rt-worker-lifecycle-write-admission-exports-001'
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Verify hosted runner assignment without external actions
        run: |
          echo "RUNNER_DISPATCH_OK"
          uname -a
          date -u
