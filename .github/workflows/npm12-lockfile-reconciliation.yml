name: npm 12 Lockfile Reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/npm12-lockfile-reconciliation.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: npm12-lockfile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Regenerate and verify npm 12 lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin the Cloudflare build npm version
        run: |
          npm install --global npm@12.2.3 --no-audit --no-fund
          test "$(npm --version)" = "12.2.3"

      - name: Regenerate lockfile using npm 12
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install using the regenerated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Retain generated lockfile for reviewed application
        uses: actions/upload-artifact@v4
        with:
          name: npm12-regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Commit verified npm 12 lockfile to PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "The committed lockfile is already reproducible with npm 12.2.3."
          else
            git commit -m "chore(deps): regenerate npm 12 lockfile"
            git push origin "HEAD:refs/heads/$PR_BRANCH"
          fi

      - name: Dispatch full verification on the updated PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh workflow run ci.yml --ref "$PR_BRANCH"
          gh workflow run ci-path-filtered.yml --ref "$PR_BRANCH"
          gh workflow run radar-backend-triad.yml --ref "$PR_BRANCH"
          gh workflow run gis-spatial-integrity.yml --ref "$PR_BRANCH"
          gh workflow run cloudflare-native-auth-validation.yml --ref "$PR_BRANCH"
          gh workflow run performance-bundle-budget.yml --ref "$PR_BRANCH"
          gh workflow run worker-native-auth-config.yml --ref "$PR_BRANCH"
