name: Temporary lockfile reconciliation

on:
  push:
    branches:
      - migration/cloudflare-native-auth-firebase-retirement

permissions:
  contents: write

jobs:
  reconcile:
    if: github.ref == 'refs/heads/migration/cloudflare-native-auth-firebase-retirement'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-native-auth-firebase-retirement
          persist-credentials: true
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile and push lockfile with concurrency retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin migration/cloudflare-native-auth-firebase-retirement
            git reset --hard origin/migration/cloudflare-native-auth-firebase-retirement
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            if git diff --quiet -- package-lock.json; then
              echo "package-lock.json is already synchronized"
              exit 0
            fi
            git add package-lock.json
            git commit -m "fix(build): synchronize npm lockfile with package manifest"
            if git push origin HEAD:migration/cloudflare-native-auth-firebase-retirement; then
              exit 0
            fi
            echo "Branch advanced during push; reloading latest manifest (attempt $attempt)"
          done
          echo "Could not push lockfile reconciliation after 3 attempts"
          exit 1
