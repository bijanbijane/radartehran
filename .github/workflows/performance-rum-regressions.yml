name: Radar RUM Measurement Regressions

on:
  pull_request:
    paths:
      - 'src/platform/performance/BrowserPerformanceCollector.ts'
      - 'tests/rt-fe-stage30-rum-measurement-truth.test.ts'
      - '.github/workflows/performance-rum-regressions.yml'

permissions:
  contents: read

concurrency:
  group: radar-rum-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rum-measurement:
    name: RUM measurement truth and INP interaction aggregation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR merge ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Run Stage 30 RUM measurement truth suite
        run: npx tsx --test tests/rt-fe-stage30-rum-measurement-truth.test.ts
