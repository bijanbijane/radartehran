name: Validate IRNI Registry Worker Integration

on:
  pull_request:
    branches: [main]
    paths:
      - worker/routes/irniRegistryRoutes.ts
      - worker/types.ts
      - worker/contextAndSecurity.ts
      - worker/router.ts
      - worker/index.ts
      - wrangler.backend.jsonc
      - migrations/geography-d1/**
      - tsconfig.irni.json
      - .github/workflows/irni-registry-integration.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependency lock
        run: npm ci
      - name: Type-check the IRNI registry Worker route and its dependency graph
        run: npx tsc --noEmit -p tsconfig.irni.json
      - name: Apply geography migrations to a disposable local D1 database
        run: npx wrangler d1 migrations apply NEIGHBORHOOD_DB --config wrangler.backend.jsonc --local --force
      - name: Bundle the production API Worker without deploying
        run: npx wrangler deploy --config wrangler.backend.jsonc --dry-run --outdir /tmp/radartehran-irni-backend-dryrun
      - name: Validate production binding and migration configuration
        run: node scripts/cloudflare/validate-backend-config.mjs
