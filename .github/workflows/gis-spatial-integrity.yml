name: GIS Spatial Integrity

on:
  push:
    branches:
      - feat/gis-spatial-integrity-2026-11-27
    paths:
      - "server/modules/geospatial/**"
      - "server/modules/valuation/**"
      - "server/modules/property-search/**"
      - "server/modules/shared/atomicJsonRepository.ts"
      - "worker/irni/neighborhoodProfileIdentityResolver.ts"
      - "worker/routes/marketplaceRoutes.ts"
      - "tests/geospatial-*.test.ts"
      - "tests/neighborhood-profile-boundary-read-model.test.ts"
      - "tests/property-valuation-engine-module.test.ts"
      - "tests/durable-repository-snapshots.test.ts"
      - "tests/irni-neighborhood-profile-identity-resolver.test.ts"
      - "tests/cloudflare-marketplace-bargain-write.test.ts"
      - "tests/property-search/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gis-spatial-integrity.yml"
  pull_request:
    branches:
      - main
    paths:
      - "server/modules/geospatial/**"
      - "server/modules/valuation/**"
      - "server/modules/property-search/**"
      - "server/modules/shared/atomicJsonRepository.ts"
      - "worker/irni/neighborhoodProfileIdentityResolver.ts"
      - "worker/routes/marketplaceRoutes.ts"
      - "tests/geospatial-*.test.ts"
      - "tests/neighborhood-profile-boundary-read-model.test.ts"
      - "tests/property-valuation-engine-module.test.ts"
      - "tests/durable-repository-snapshots.test.ts"
      - "tests/irni-neighborhood-profile-identity-resolver.test.ts"
      - "tests/cloudflare-marketplace-bargain-write.test.ts"
      - "tests/property-search/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gis-spatial-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gis-spatial-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gis-regression:
    name: GIS geometry, identity, persistence and valuation regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run GIS, valuation, persistence, IRNI and property-search regressions
        run: >-
          npm run test:geospatial &&
          npm run test:valuation-location &&
          npx tsx --test
          tests/durable-repository-snapshots.test.ts
          tests/irni-neighborhood-profile-identity-resolver.test.ts
          tests/cloudflare-marketplace-bargain-write.test.ts
          tests/property-search/__tests__/propertySearch.test.ts

  gis-typecheck:
    name: GIS module TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck
