name: Tehran Radar CI Quality Gates

on:
  push:
    branches:
      - main
      - master
      - cursor/rt-infra-001-gate-b-monorepo
  pull_request:
    # Validate stacked PRs against their actual base branch as well as PRs to main.
    # This keeps dependent workstreams from bypassing CI merely because they target
    # another open PR branch.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_ENV: test
  PORT: "3000"
  APP_URL: "http://127.0.0.1:3000"

jobs:
  quality-gates:
    name: TypeScript, Architecture, Unit, Storage, Stress & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clean repository checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22 with npm lockfile cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Deterministic dependency installation
        run: npm ci

      - name: Gate A — TypeScript Lint & Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ci-gate-a-lint.log
          npm run typecheck 2>&1 | tee ci-gate-a-typecheck.log

      - name: Gate B — Architecture & Module Boundary Guardrails
        shell: bash
        run: |
          set -o pipefail
          npm run arch:check 2>&1 | tee ci-gate-b-architecture.log

      - name: Gate C — Automated Unit, Security, Rules, Contract, Mutation, Roadmap & Insights Suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee ci-gate-c-unit.log
          npm run test:roadmap 2>&1 | tee ci-gate-c-roadmap.log
          npm run test:contracts 2>&1 | tee ci-gate-c-contracts.log
          npm run test:mutation 2>&1 | tee ci-gate-c-mutation.log

      - name: Gate D — 50-Cycle Stress & Fuzzing Suite
        shell: bash
        run: |
          set -o pipefail
          npx tsx tests/stress-50-cycles.test.ts 2>&1 | tee ci-gate-d-stress.log

      - name: Gate E — Object Storage Auth, Security & Byte-Range Suites
        shell: bash
        run: |
          set -o pipefail
          npx tsx tests/object-storage-upload-auth.test.ts 2>&1 | tee ci-gate-e-upload-auth.log
          npx tsx tests/object-storage-security.test.ts 2>&1 | tee ci-gate-e-security.log
          npx tsx tests/object-storage-range.test.ts 2>&1 | tee ci-gate-e-range.log

      - name: Gate F — Production Bundle Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-gate-f-build.log

      - name: Gate G — Cloudflare Worker Platform & Staging Bundle Dry-Run
        shell: bash
        run: |
          set -o pipefail
          npm run test:cloudflare 2>&1 | tee ci-gate-g-cloudflare-tests.log
          npx wrangler deploy --env staging --dry-run --outdir /tmp/radartehran-staging-dryrun 2>&1 | tee ci-gate-g-wrangler-dry-run.log

      - name: Retain CI diagnostics and architecture baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-diagnostics-${{ github.run_attempt }}
          path: |
            ci-gate-*.log
            architecture-baseline.json
          if-no-files-found: ignore
          retention-days: 7

  e2e-browser:
    name: Real Browser E2E & Accessibility Suite (Playwright)
    runs-on: ubuntu-latest
    needs: quality-gates
    timeout-minutes: 20

    steps:
      - name: Clean repository checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22 with npm lockfile cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Deterministic dependency installation
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Execute Real Browser E2E Suite
        run: npm run test:e2e

      - name: Retain Playwright traces, screenshots, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
